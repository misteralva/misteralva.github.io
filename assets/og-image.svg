<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0b12"/>

  <!-- Accent glow left -->
  <radialGradient id="g1" cx="18%" cy="52%" r="55%">
    <stop offset="0%" stop-color="#64ffda" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#0b0b12" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g1)"/>

  <!-- Subtle right glow -->
  <radialGradient id="g2" cx="88%" cy="48%" r="40%">
    <stop offset="0%" stop-color="#64ffda" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#0b0b12" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Horizontal rules -->
  <line x1="80" y1="178" x2="1120" y2="178" stroke="#64ffda" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="80" y1="460" x2="1120" y2="460" stroke="#64ffda" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top tag -->
  <text x="80" y="153" font-family="'Courier New',Courier,monospace" font-size="15" letter-spacing="5" fill="#64ffda" opacity="0.65">IT SYSTEMS · NETWORKS · BARCELONA</text>

  <!-- Main name -->
  <text x="80" y="335" font-family="Georgia,'Times New Roman',serif" font-size="108" font-style="italic" fill="#e8e6f0" letter-spacing="-2">David Álvarez</text>
  <text x="84" y="410" font-family="Georgia,'Times New Roman',serif" font-size="66" font-style="italic" fill="#e8e6f0" opacity="0.22">Fernández</text>

  <!-- DA. watermark top-right -->
  <text x="960" y="390" font-family="Georgia,'Times New Roman',serif" font-size="180" font-style="italic" fill="#64ffda" opacity="0.07">DA.</text>

  <!-- Credential chips -->
  <!-- CCNA -->
  <rect x="80" y="476" width="96" height="28" rx="5" fill="#64ffda" fill-opacity="0.12" stroke="#64ffda" stroke-opacity="0.35" stroke-width="1"/>
  <text x="128" y="495" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="2" fill="#64ffda" text-anchor="middle">CCNA</text>
  <!-- ASIR -->
  <rect x="188" y="476" width="96" height="28" rx="5" fill="#64ffda" fill-opacity="0.06" stroke="#64ffda" stroke-opacity="0.18" stroke-width="1"/>
  <text x="236" y="495" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="2" fill="#e8e6f0" fill-opacity="0.45" text-anchor="middle">ASIR</text>
  <!-- C1 EN -->
  <rect x="296" y="476" width="106" height="28" rx="5" fill="#64ffda" fill-opacity="0.06" stroke="#64ffda" stroke-opacity="0.18" stroke-width="1"/>
  <text x="349" y="495" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="2" fill="#e8e6f0" fill-opacity="0.45" text-anchor="middle">C1 EN</text>
  <!-- SAP -->
  <rect x="414" y="476" width="86" height="28" rx="5" fill="#64ffda" fill-opacity="0.06" stroke="#64ffda" stroke-opacity="0.18" stroke-width="1"/>
  <text x="457" y="495" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="2" fill="#e8e6f0" fill-opacity="0.45" text-anchor="middle">SAP</text>
  <!-- Cisco -->
  <rect x="512" y="476" width="106" height="28" rx="5" fill="#64ffda" fill-opacity="0.06" stroke="#64ffda" stroke-opacity="0.18" stroke-width="1"/>
  <text x="565" y="495" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="2" fill="#e8e6f0" fill-opacity="0.45" text-anchor="middle">CISCO</text>

  <!-- Bottom URL -->
  <text x="80" y="585" font-family="'Courier New',Courier,monospace" font-size="15" letter-spacing="3" fill="#64ffda" opacity="0.38">OS Portfolio · github.com/misteralva</text>
</svg>
